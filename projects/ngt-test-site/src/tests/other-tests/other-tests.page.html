<ng-container *ngtContext="let t; node: 'other'">
  <nts-accordion [collapsing]="true">
    <div ftsAccordionItem [title]="t('enumeration.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-enumeration></nts-enumeration>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('formatExtender.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-format-extender></nts-format-extender>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('camelCase.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-camel-case></nts-camel-case>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('inlineLoader.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-inline-loader></nts-inline-loader>
        </div>
      </ng-template>
    </div>
  </nts-accordion>
</ng-container>
