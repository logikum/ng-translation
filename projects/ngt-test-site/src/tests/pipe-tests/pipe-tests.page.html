<ng-container *ngtContext="let t; node: 'translate'">
  <nts-accordion [collapsing]="true">
    <div ftsAccordionItem [title]="t('number.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-to-number></nts-to-number>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('percent.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-to-percent></nts-to-percent>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('currency.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-to-currency></nts-to-currency>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('money.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-to-money></nts-to-money>
        </div>
      </ng-template>
    </div>
    <div ftsAccordionItem [title]="t('datetime.title')">
      <ng-template ftsAccordionContent>
        <div class="accordion-content">
          <nts-to-datetime></nts-to-datetime>
        </div>
      </ng-template>
    </div>
  </nts-accordion>
</ng-container>
