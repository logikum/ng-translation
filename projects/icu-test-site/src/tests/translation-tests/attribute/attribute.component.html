<div class="context">--- the source is the same section ---</div>
<div class="data" ngtText="translation.text.otherElements"></div>
<div class="data flex-row">
  <div class="row-item" ngtText="translation.text.element.earth"></div>
  <div class="row-item" ngtText="translation.text.element.water"></div>
  <div class="row-item" ngtText="translation.text.element.wind"></div>
  <div class="row-item" ngtText="translation.text.element.fire"></div>
</div>
<div class="data" ngtHtml="translation.text.smurfs"></div>

<div class="context">--- the sources are shared sections ---</div>
<div class="data" ngtText="shared.fourSeasons"></div>
<div class="data flex-row">
  <div class="row-item" ngtText="enums.season.spring"></div>
  <div class="row-item" ngtText="enums.season.summer"></div>
  <div class="row-item" ngtText="enums.season.autumn"></div>
  <div class="row-item" ngtText="enums.season.winter"></div>
</div>
<div class="data" ngtHtml="shared.pooh"></div>

<ng-container *ngtContext="let t; node: 'translation.text'">
  <div class="context">--- with interpolation ---</div>
  <div class="data" [ngtText]="'translation.text.today'"[ngtParams]="{ today }"></div>
  <div class="data" [ngtText]="'translation.text.stock'" [ngtParams]="{ surge, points }"></div>
  <div class="data" [ngtText]="'translation.text.book'" [ngtParams]="book"></div>
</ng-container>
