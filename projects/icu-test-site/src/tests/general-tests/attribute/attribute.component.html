  <div class="row-item" ngtText="general.text.element.earth"></div>
  <div class="row-item" ngtText="general.text.element.water"></div>
  <div class="row-item" ngtText="general.text.element.wind"></div>
  <div class="row-item" ngtText="general.text.element.fire"></div>
</div>

<div class="context">--- the sources are shared sections ---</div>

<div class="data flex-row">
  <div class="row-item" ngtText="enums.season.spring"></div>

<ng-container *ngtContext="let t; node: 'general.text'">

  <div class="data" [ngtParams]="{ surge, points }" [ngtText]="'general.text.stock'"></div>
  <div class="data" [ngtParams]="book" [ngtText]="'general.text.book'"></div>
</ng-container>
